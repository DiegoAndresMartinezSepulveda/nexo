name: Nexo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-sqlite-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run application tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test
      - name: Check all PHP dependencies
        run: composer audit
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Check all frontend dependencies
        run: npm audit --prefix frontend
      - name: Build web application
        run: npm run build --prefix frontend
      - name: Ensure deployable Angular assets are committed
        run: git diff --exit-code -- public/app

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: nexo_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo, gd
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run migrations and feature tests against MySQL
        run: php artisan test
