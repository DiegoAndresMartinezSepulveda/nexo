info:
  name: Create Notification Contact
  type: http
  seq: 33

http:
  method: POST
  url: '{{baseUrl}}/api/notification-contacts'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Destinatario",
        "email": "destinatario@example.com",
        "channel": "email",
        "is_default": false
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: POST /api/notification-contacts. Update request variables and JSON body as required by the endpoint.
