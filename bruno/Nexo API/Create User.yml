info:
  name: Create User
  type: http
  seq: 15

http:
  method: POST
  url: '{{baseUrl}}/api/users'
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Usuario de prueba",
        "email": "usuario@example.com",
        "password": "CAMBIA_ESTA_CONTRASENA",
        "role": "editor",
        "workspace_ids": [1]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: POST /api/users. Update request variables and JSON body as required by the endpoint.
