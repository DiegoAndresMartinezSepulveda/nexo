info:
  name: Save Catalog Item
  type: http
  seq: 23

http:
  method: POST
  url: '{{baseUrl}}/api/catalog/{{kind}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Cliente de prueba",
        "code": "CLI-001",
        "client_id": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: POST /api/catalog/{{kind}}. Update request variables and JSON body as required by the endpoint.
