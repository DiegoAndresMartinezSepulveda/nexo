info:
  name: Move Task
  type: http
  seq: 45

http:
  method: PATCH
  url: '{{baseUrl}}/api/tasks/{{taskId}}/move'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "environment": "development",
        "status": "development",
        "rollback_reason": ""
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: PATCH /api/tasks/{{taskId}}/move. Update request variables and JSON body as required by the endpoint.
