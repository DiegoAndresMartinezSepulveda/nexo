http:
  method: PUT
  url: '{{baseUrl}}/api/entries/{{entryId}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

