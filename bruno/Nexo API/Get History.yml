info:
  name: Get History
  type: http
  seq: 40

http:
  method: GET
  url: '{{baseUrl}}/api/history?page=1'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: GET /api/history. Update request variables and JSON body as required by the endpoint.
