info:
  name: Delete Attachment
  type: http
  seq: 50

http:
  method: DELETE
  url: '{{baseUrl}}/api/attachments/{{attachmentId}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: DELETE /api/attachments/{{attachmentId}}. Update request variables and JSON body as required by the endpoint.
