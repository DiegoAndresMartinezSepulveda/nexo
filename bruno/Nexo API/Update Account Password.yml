      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "current_password": "TU_CONTRASENA_ACTUAL",
        "password": "NUEVA_CONTRASENA_DE_12_CARACTERES",
        "password_confirmation": "NUEVA_CONTRASENA_DE_12_CARACTERES"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

