info:
  name: Get Mobile Asset Token
  type: http
  seq: 5

http:
  method: GET
  url: '{{baseUrl}}/api/mobile/asset-token'
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: GET /api/mobile/asset-token. Update request variables and JSON body as required by the endpoint.
