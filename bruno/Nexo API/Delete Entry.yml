info:
  name: Delete Entry
  type: http
  seq: 30

http:
  method: DELETE
  url: '{{baseUrl}}/api/entries/{{entryId}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: DELETE /api/entries/{{entryId}}. Update request variables and JSON body as required by the endpoint.
