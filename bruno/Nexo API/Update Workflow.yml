info:
  name: Update Workflow
  type: http
  seq: 37

http:
  method: PUT
  url: '{{baseUrl}}/api/workflow'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "statuses": ["pending", "development", "review", "done"],
        "environments": ["local", "development", "qa", "certification", "production"]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: PUT /api/workflow. Update request variables and JSON body as required by the endpoint.
