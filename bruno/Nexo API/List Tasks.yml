info:
  name: List Tasks
  type: http
  seq: 41

http:
  method: GET
  url: '{{baseUrl}}/api/tasks?environment={{environment}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: GET /api/tasks. Update request variables and JSON body as required by the endpoint.
