info:
  name: Get Media
  type: http
  seq: 39

http:
  method: GET
  url: '{{baseUrl}}/api/media/{{mediaId}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: GET /api/media/{{mediaId}}. Update request variables and JSON body as required by the endpoint.
