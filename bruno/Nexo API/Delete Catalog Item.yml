info:
  name: Delete Catalog Item
  type: http
  seq: 25

http:
  method: DELETE
  url: '{{baseUrl}}/api/catalog/{{kind}}/{{catalogId}}'
  headers:
    - name: Accept
      value: application/json
    - name: X-Workspace-ID
      value: '{{workspaceId}}'
    - name: Authorization
      value: Bearer {{token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: DELETE /api/catalog/{{kind}}/{{catalogId}}. Update request variables and JSON body as required by the endpoint.
